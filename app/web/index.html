<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lanfile</title>
<style>
  :root{
    --bg:#0A0B0D; --panel:#0E1013; --line:rgba(255,255,255,.07);
    --text:#E9EAEC; --muted:#878D96; --dim:#5D636C;
    --accent:#C6F24E; --accent-soft:rgba(198,242,78,.10); --danger:#FF6A5A;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid;grid-template-rows:56px 1fr 40px;height:100svh;overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- 顶栏 ---------- */
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:0 24px;border-bottom:1px solid var(--line);
    animation:fade .5s var(--ease) both;
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:-.01em}
  .mark{width:8px;height:8px;border-radius:2px;background:var(--accent);box-shadow:0 0 14px rgba(198,242,78,.45)}
  .self{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);min-width:0}
  .self .alias{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:26ch}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none;transition:background .3s,box-shadow .3s}
  .dot.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .sep{color:rgba(255,255,255,.18)}
  .mono{font-family:var(--mono);font-size:11.5px;color:var(--dim)}

  /* ---------- 主区 ---------- */
  main{display:grid;grid-template-columns:1fr 300px;min-height:0}
  .peers{
    background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;padding:20px 0;
    animation:fade .5s .05s var(--ease) both;
  }
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;margin-bottom:12px}
  .sec-head h2{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
  .count{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .head-right{display:flex;align-items:center;gap:9px}
  .ghost.add{
    background:none;border:0;color:var(--dim);font-size:15px;line-height:1;cursor:pointer;
    padding:1px 5px;border-radius:6px;font-family:inherit;transition:background .15s,color .15s;
  }
  .ghost.add:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .add-form{display:flex;gap:8px;padding:0 22px 12px}
  .add-form[hidden]{display:none}
  .add-form input{
    flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:7px;color:var(--text);font-family:var(--mono);font-size:11.5px;
    padding:7px 9px;outline:none;transition:border-color .15s;
  }
  .add-form input:focus{border-color:rgba(198,242,78,.45)}
  .add-form input::placeholder{color:var(--dim)}
  .add-form button{
    background:var(--accent);color:#0A0B0D;border:0;border-radius:7px;
    font-family:inherit;font-size:11.5px;font-weight:600;padding:0 12px;cursor:pointer;
    transition:filter .15s;
  }
  .add-form button:hover{filter:brightness(.92)}
  .add-err{padding:0 22px 12px;font-size:11px;color:var(--danger);line-height:1.5;word-break:break-word}
  .add-err[hidden]{display:none}
  .peer .x{
    background:none;border:0;color:var(--dim);cursor:pointer;
    font-size:13px;line-height:1;padding:2px 4px;border-radius:4px;opacity:0;transition:opacity .15s,color .15s;
  }
  .peer:hover .x{opacity:1}
  .peer .x:hover{color:var(--danger)}
  .peer .star{
    margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;
    font-size:13px;line-height:1;padding:2px 5px;border-radius:4px;flex:none;
    opacity:.3;transition:opacity .15s,color .15s;
  }
  .peer:hover .star{opacity:.85}
  .peer .star:hover{color:var(--accent)}
  .peer.fav .star{opacity:1;color:var(--accent)}

  .peer-list{flex:1;overflow:auto;padding:2px 0}
  .peer{
    display:flex;align-items:center;gap:12px;padding:12px 22px;cursor:pointer;
    border-right:2px solid transparent;transition:background .18s,border-color .18s;
  }
  .peer:hover{background:rgba(255,255,255,.03)}
  .peer.sel{background:rgba(198,242,78,.055);border-right-color:var(--accent)}
  .avatar{
    width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.05);font-family:var(--mono);font-size:12px;color:var(--muted);
    transition:background .18s,color .18s;
  }
  .peer.sel .avatar{background:var(--accent);color:#0A0B0D}
  .peer .meta{min-width:0;flex:1}
  .peer .alias{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .peer .addr{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px}
  .status-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--dim);transition:background .25s,box-shadow .25s}
  .peer.online .status-dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .peer.offline{opacity:.45;cursor:default}
  .peer.offline:hover{background:transparent}
  .peer .status-text{font-size:10px;color:var(--dim);font-weight:400}
  .peer.offline .status-text{color:var(--danger)}
  .peer.offline .avatar{background:rgba(255,255,255,.03);color:var(--dim)}
  .peers-foot{padding:12px 22px 0;font-size:11px;color:var(--dim);line-height:1.6}

  .peers-act{padding:14px 22px 0}
  .send{
    width:100%;height:40px;border:0;border-radius:10px;
    background:var(--accent);color:#0A0B0D;font-family:inherit;font-size:13px;font-weight:600;
    cursor:pointer;transition:filter .15s,background .15s,color .15s;
  }
  .send:hover:not(:disabled){filter:brightness(.93)}
  .send:disabled{background:rgba(255,255,255,.055);color:var(--dim);cursor:not-allowed}
  .send-hint{padding:9px 22px 0;font-size:11px;color:var(--dim);text-align:center;line-height:1.5}

  /* ---------- 待发送列表 ---------- */
  .drop.staged{justify-content:flex-start;align-items:stretch;padding:0;cursor:default;gap:0}
  .drop.staged:hover{border-color:rgba(255,255,255,.13)}
  .staging{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:44px}
  .staging-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 16px;border-bottom:1px solid var(--line);
  }
  .staging-head .sum{font-size:11.5px;color:var(--muted)}
  .staging-list{flex:1;overflow:auto;padding:6px}
  .stage-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;transition:background .15s}
  .stage-item:hover{background:rgba(255,255,255,.03)}
  .stage-item .ico{
    width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.055);color:var(--muted);font-family:var(--mono);font-size:10px;
  }
  .stage-item .nm{flex:1;min-width:0}
  .stage-item .nm b{display:block;font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stage-item .nm span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:1px}
  .stage-item .x{
    background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;
    padding:3px 6px;border-radius:5px;transition:color .15s,background .15s;flex:none;
  }
  .stage-item .x:hover{color:var(--danger);background:rgba(255,106,90,.1)}
  .staging-foot{
    padding:10px 16px;border-top:1px solid var(--line);
    font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:12px;
  }

  .workspace{
    display:flex;flex-direction:column;gap:20px;min-height:0;padding:22px 26px;
    animation:fade .5s .1s var(--ease) both;
  }

  /* ---------- 拖放区 ---------- */
  .drop{
    flex:1;min-height:170px;position:relative;border-radius:14px;cursor:pointer;
    border:1px dashed rgba(255,255,255,.13);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    transition:border-color .2s,background .2s;
  }
  .drop:hover{border-color:rgba(255,255,255,.23)}
  .drop-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
  .drop-empty[hidden]{display:none}
  .staging[hidden]{display:none}
  .drop.staged .target{display:none}
  .drop.over{border-color:var(--accent);background:rgba(198,242,78,.05)}
  .drop.over .icon{color:var(--accent);transform:translateY(-5px)}
  .drop.need{border-color:var(--danger);animation:shake .4s var(--ease)}
  .icon{color:var(--dim);transition:transform .28s var(--ease),color .2s}
  .drop-title{font-size:19px;font-weight:500;letter-spacing:-.012em}
  .drop-sub{font-size:12.5px;color:var(--muted);text-align:center;padding:0 24px}
  .drop-actions{margin-top:2px;font-size:12.5px;color:var(--dim)}
  .link{
    background:none;border:0;padding:0;font:inherit;color:var(--muted);cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.2);
    transition:color .15s;
  }
  .link:hover{color:var(--text)}
  .target{
    position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);
    padding:5px 10px;border-radius:999px;animation:fade .3s var(--ease) both;
  }
  .target[hidden]{display:none}

  /* ---------- 传输列表 ---------- */
  .queue{display:flex;flex-direction:column;min-height:0}
  .queue[hidden]{display:none}
  .ghost{
    background:none;border:0;color:var(--dim);font-size:11px;cursor:pointer;padding:2px 0;
    transition:color .15s;font-family:inherit;
  }
  .ghost:hover{color:var(--text)}
  .queue-list{overflow:auto;max-height:34vh}
  .item{padding:11px 0 13px;border-top:1px solid var(--line);animation:rise .34s var(--ease) both}
  .item-top{display:flex;align-items:baseline;justify-content:space-between;gap:18px}
  .item-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-meta{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
  .item.done .item-meta{color:var(--accent)}
  .item.err .item-meta{color:var(--danger)}
  .bar{height:2px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .22s linear}
  .item.done .bar i{box-shadow:0 0 10px rgba(198,242,78,.5)}
  .item.err .bar i{background:var(--danger);width:100%!important;opacity:.45}
  .item-note{margin-top:7px;font-size:11px;color:var(--danger);line-height:1.5;word-break:break-word;white-space:pre-line}

  .empty{padding:14px 0;font-size:12px;color:var(--dim);border-top:1px solid var(--line)}
  .empty-peer{padding:14px 22px;font-size:12px;color:var(--dim)}
  .recv-dir{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44ch}

  /* ---------- 模式切换: 卡片顶部居中 ---------- */
  .mode-switch{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    display:flex;gap:2px;padding:3px;z-index:2;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);
    border-radius:999px;backdrop-filter:blur(8px);
  }
  .mode-btn{
    background:none;border:0;border-radius:999px;padding:5px 18px;
    font-family:inherit;font-size:12px;line-height:1.5;letter-spacing:.01em;
    color:var(--muted);cursor:pointer;transition:background .18s,color .18s;
  }
  .mode-btn:hover{color:var(--text)}
  .mode-btn.on{background:var(--accent);color:#0A0B0D;font-weight:600}
  .mode-btn.on:hover{color:#0A0B0D}

  /* ---------- 接收模式面板 ---------- */
  .drop.recv-mode{cursor:default;border-color:rgba(255,255,255,.13)}
  .drop.recv-mode:hover{border-color:rgba(255,255,255,.13)}
  /* 接收模式下右侧的“发送”操作与拖入提示与当前模式无关, 先收起来 */
  body.recv-mode .peers-act,body.recv-mode .send-hint{display:none}
  .recv-body{
    flex:1;display:flex;flex-direction:column;justify-content:center;gap:11px;
    width:100%;max-width:520px;padding:56px 24px 24px;
  }
  .recv-body[hidden]{display:none}
  .recv-title{font-size:16px;font-weight:500;letter-spacing:-.012em;text-align:center}
  .recv-sub{font-size:12.5px;color:var(--muted);text-align:center}
  .recv-dir-row{display:flex;gap:8px;width:100%;margin-top:2px}
  .recv-input{
    flex:1;min-width:0;background:rgba(255,255,255,.045);border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;color:var(--text);outline:none;
    font-family:var(--mono);font-size:12px;transition:border-color .15s;
  }
  .recv-input:focus{border-color:rgba(198,242,78,.45)}
  .recv-input::placeholder{color:var(--dim)}
  .recv-pick{
    flex:none;background:var(--accent);color:#0A0B0D;border:0;border-radius:8px;
    padding:0 16px;height:36px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
    transition:filter .15s;
  }
  .recv-pick:hover{filter:brightness(.93)}
  .recv-pick:disabled{opacity:.45;cursor:not-allowed}
  .recv-ghost{
    flex:none;background:rgba(255,255,255,.04);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:0 14px;height:36px;
    font-family:inherit;font-size:12px;cursor:pointer;transition:background .15s,border-color .15s;
  }
  .recv-ghost:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}
  .recv-ghost[hidden]{display:none}
  .recv-input{height:36px}
  .recv-save{
    flex:none;background:var(--accent);color:#0A0B0D;border:0;border-radius:8px;
    padding:0 16px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
    transition:filter .15s;
  }
  .recv-save:hover{filter:brightness(.93)}
  .recv-save:disabled{opacity:.45;cursor:not-allowed}
  .recv-tip{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.6}
  .recv-msg{font-size:12px;min-height:18px;text-align:center}
  .recv-msg.ok{color:var(--accent)}
  .recv-msg.err{color:var(--danger)}

  footer{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:0 24px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);
  }

  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  @media (max-width:820px){
    main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .peers{order:-1;border-left:0;border-bottom:1px solid var(--line);padding:16px 0 12px}
    .peer-list{display:flex;overflow-x:auto;padding:0 12px;gap:8px}
    .peer{flex:none;border-right:0;border-bottom:2px solid transparent;border-radius:10px;padding:10px 12px}
    .peer.sel{border-bottom-color:var(--accent)}
    .peers-foot{display:none}
    .workspace{padding:16px}
    .queue-list{max-height:40vh}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span>lanfile</div>
  <div class="self">
    <span class="dot" id="selfDot"></span>
    <span class="alias" id="selfAlias">连接中…</span>
    <span class="sep">·</span>
    <span class="mono" id="selfAddr">—</span>
  </div>
</header>

<main>
  <section class="workspace">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择要发送的文件">
      <div class="mode-switch" role="tablist" aria-label="发送或接收模式">
        <button class="mode-btn on" id="modeSend" type="button" role="tab" aria-selected="true">发送</button>
        <button class="mode-btn" id="modeRecv" type="button" role="tab" aria-selected="false">接收</button>
      </div>

      <div class="drop-empty" id="dropEmpty">
        <svg class="icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <div class="drop-title">拖入文件或文件夹</div>
        <div class="drop-sub" id="dropSub">原样传输，不压缩不改名 · 拖入后可确认再发送</div>
        <div class="drop-actions">或 <button class="link" id="filePick" type="button">选择文件</button> · <button class="link" id="dirPick" type="button">选择文件夹</button></div>
      </div>

      <div class="staging" id="staging" hidden>
        <div class="staging-head">
          <span class="sum" id="stageSum"></span>
          <button class="ghost" id="stageClear" type="button">清空</button>
        </div>
        <div class="staging-list" id="stageList"></div>
        <div class="staging-foot">
          <span>继续拖入可追加</span>
          <button class="link" id="stageAdd" type="button">选择文件</button>
        </div>
      </div>

      <div class="recv-body" id="recvBody" hidden>
        <div class="recv-title">接收文件夹</div>
        <div class="recv-sub">收到的文件原样存进这个目录</div>
        <div class="recv-dir-row">
          <input id="recvDirInput" class="recv-input" type="text" spellcheck="false" autocomplete="off" placeholder="点右侧按钮挑一个目录">
          <button class="recv-pick" id="recvDirPick" type="button">选择文件夹</button>
          <button class="recv-ghost" id="recvDirSave" type="button" hidden>保存</button>
        </div>
        <div class="recv-tip">改动立即生效, 之后的传输都会存到新目录</div>
        <div class="recv-msg" id="recvMsg"></div>
      </div>

      <div class="target" id="targetChip" hidden></div>
    </div>
    <input type="file" id="fileInput" multiple hidden>
    <input type="file" id="dirInput" webkitdirectory hidden>

    <div class="queue" id="sendQueue">
      <div class="sec-head">
        <h2>传输</h2>
        <button class="ghost" id="clearBtn" type="button">清空记录</button>
      </div>
      <div class="queue-list" id="queueList"></div>
      <div class="empty" id="queueEmpty">还没有传输记录</div>
    </div>

    <div class="queue" id="recvSec" hidden>
      <div class="sec-head">
        <h2>最近接收</h2>
        <span class="mono recv-dir" id="recvDir"></span>
      </div>
      <div class="queue-list" id="recvList"></div>
    </div>
  </section>

  <aside class="peers">
    <div class="sec-head">
      <h2>局域网设备</h2>
      <span class="head-right">
        <span class="count" id="peerCount">0</span>
        <button class="ghost add" id="addBtn" type="button" title="手动添加设备（跨网段时用）">＋</button>
      </span>
    </div>
    <form class="add-form" id="addForm" hidden>
      <input id="addInput" placeholder="172.20.40.102 或 IP:端口" autocomplete="off" spellcheck="false">      <button type="submit">添加</button>
    </form>
    <div class="add-err" id="addErr" hidden></div>
    <div class="peer-list" id="peerList"></div>
    <div class="send-hint" id="sendHint"></div>
    <div class="peers-act">
      <button class="send" id="sendBtn" type="button" disabled>发送</button>
    </div>
  </aside>
</main>

<footer>
  <span>字节原样 · 双端 SHA-256 校验 · 断点续传</span>
</footer>

<script>
(function(){
  'use strict';

  // nativeMode: 内嵌 WebView 里 <input type="file"> 打不开系统框,
  // 这种模式下选文件/文件夹走后端原生对话框, 后端直接读本机路径发送。
  var nativeMode = !!(window.chrome === undefined && /^http:\/\/127\.0\.0\.1|localhost/.test(location.href));

  // 交给后端弹原生选择框, 返回带本机路径的分组清单
  function pickViaBackend(kind){
    var url = kind === 'dir' ? '/api/picksenddir' : '/api/pickfiles';
    return fetch(url, { method: 'POST' }).then(function(r){
      return r.json().then(function(j){ return { ok: r.ok, body: j }; });
    }).then(function(res){
      if (!res.ok) throw new Error(res.body.error || '打开选择框失败');
      return res.body.groups || [];
    });
  }

  function pickFiles(){
    if (nativeMode) {
      pickViaBackend('file').then(function(groups){
        if (groups && groups.length) addPending(groupsToPending(groups));
      }).catch(function(e){ flashNeed(e.message); });
      return;
    }
    $('fileInput').click();
  }

  function pickDirs(){
    if (nativeMode) {
      pickViaBackend('dir').then(function(groups){
        if (groups && groups.length) addPending(groupsToPending(groups));
      }).catch(function(e){ flashNeed(e.message); });
      return;
    }
    $('dirInput').click();
  }

  // 后端分组 -> 前端 pending 结构, file 项带 localPath 供后端直读
  function groupsToPending(groups){
    return groups.map(function(g){
      return {
        name: g.name, root: g.root,
        files: g.files.map(function(f){
          return { file: null, localPath: f.localPath, rel: f.rel, name: f.name };
        })
      };
    });
  }

  var state = { devices: [], remote: [], manual: [], fav: [], selectedKeys: [], pending: [], jobs: [], busy: false, self: null, peerKey: null, received: [], recvDir: '', online: {} };
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- 手动添加的设备 (存本地, 刷新不丢) ---------- */
  var MANUAL_KEY = 'lanfile.manual';
  function saveManual(){
    try { localStorage.setItem(MANUAL_KEY, JSON.stringify(state.manual)); } catch(e){}
  }
  function loadManual(){
    try {
      var v = JSON.parse(localStorage.getItem(MANUAL_KEY) || '[]');
      state.manual = Array.isArray(v) ? v : [];
    } catch(e) { state.manual = []; }
  }

  /* ---------- 收藏 (存本地, 排在最前) ---------- */
  var FAV_KEY = 'lanfile.fav';
  function saveFav(){
    try { localStorage.setItem(FAV_KEY, JSON.stringify(state.fav)); } catch(e){}
  }
  function loadFav(){
    try {
      var v = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
      state.fav = Array.isArray(v) ? v : [];
    } catch(e) { state.fav = []; }
  }
  function devAddr(d){ return d.ip + ':' + d.port; }
  // 自动发现的设备用指纹认, 手填的没有指纹就用 ip:port 认,
  // 免得同一台机器换了一种被发现方式后收藏失效
  function favIndex(d){
    for (var i = 0; i < state.fav.length; i++) {
      var f = state.fav[i];
      if (f.fp && d.fingerprint && f.fp === d.fingerprint) return i;
      if (f.addr && f.addr === devAddr(d)) return i;
    }
    return -1;
  }
  function isFav(d){ return favIndex(d) >= 0; }
  function toggleFav(d){
    var i = favIndex(d);
    if (i >= 0) state.fav.splice(i, 1);
    else state.fav.push({ fp: d.fingerprint || '', addr: devAddr(d), alias: d.alias || '' });
    saveFav();
    state.peerKey = null; // 顺序会变, 强制重绘
    renderDevices();
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- 本机信息 ---------- */
  function loadInfo(){
    fetch('/api/info').then(function(r){ return r.json(); }).then(function(info){
      state.self = info;
      $('selfAlias').textContent = info.alias || '未命名设备';
      $('selfAddr').textContent = (info.ips && info.ips.length ? info.ips.join(' · ') : '—') + ':' + info.port;
      $('selfDot').classList.add('on');
      var dirEl = $('recvDir');
      dirEl.textContent = info.dir ? '保存于 ' + info.dir : '';
      dirEl.title = info.dir || '';
    }).catch(function(){});
  }

  /* ---------- 设备列表 ---------- */
  function loadDevices(){
    fetch('/api/devices').then(function(r){ return r.json(); }).then(function(list){
      state.remote = list;
      renderDevices();
      pingAll();
    }).catch(function(){});
  }

  // 自动发现的设备 + 手动添加的设备。跨网段时组播过不去, 只能手填 IP。
  // key 用于选中标识, target 是发给 /api/send 的参数 (指纹或 ip:port)
  // online 为 true 表示最近一次探活成功; 未探过的新设备先按在线处理。
  function mergeDevices(){
    var out = (state.remote || []).map(function(d){
      d.key = d.fingerprint;
      d.target = d.fingerprint;
      d.online = state.online[devAddr(d)] !== false;
      return d;
    });
    state.manual.forEach(function(m){
      var dup = out.some(function(d){ return d.ip === m.ip && d.port === m.port; });
      if (dup) return;
      out.push({
        alias: m.alias || m.ip, ip: m.ip, port: m.port, manual: true,
        key: 'addr:' + m.ip + ':' + m.port,
        target: m.ip + ':' + m.port,
        online: state.online[m.ip + ':' + m.port] !== false
      });
    });
    // 收藏的离线设备保留在列表并标记未连接; 普通离线设备直接隐藏
    out = out.filter(function(d){ return d.online || isFav(d); });
    out.sort(function(a, b){
      if (isFav(a) !== isFav(b)) return isFav(a) ? -1 : 1;
      if (a.online !== b.online) return a.online ? -1 : 1;
      return (a.alias || '').localeCompare(b.alias || '');
    });
    return out;
  }

  // 探活: 直接访问对端 /api/ping, 成功记为在线, 失败记为离线。
  // 与设备列表刷新解耦, 每个设备独立计时, 避免轮询互相拖慢。
  function pingDevice(d){
    var addr = d.ip + ':' + d.port;
    // 走本机后端代理探测对端, 避免浏览器跨网段直连被 CORS 拦截而误判离线。
    fetch('/api/ping?addr=' + encodeURIComponent(addr), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(){ state.online[addr] = true; })
      .catch(function(){ state.online[addr] = false; })
      .then(function(){ renderDevices(); });
  }

  function pingAll(){
    var list = mergeDevices();
    list.forEach(function(d){
      // 组播刚上报的设备给一点宽限, 避免一上来就被标离线
      setTimeout(function(){ pingDevice(d); }, 120);
    });
  }

  function renderDevices(){
    var list = mergeDevices();
    var key = list.map(function(d){ return d.key + '|' + (d.alias || '') + '|' + (d.online ? 'on' : 'off'); }).join(',');
    state.devices = list;
    if (key === state.peerKey) return;
    state.peerKey = key;
    // 设备下线后把对应的选中清掉
    state.selectedKeys = state.selectedKeys.filter(function(k){
      var d = list.find(function(x){ return x.key === k; });
      return d && d.online;
    });
    // 局域网里只有一台在线设备时直接选中, 少一次点击
    var online = list.filter(function(d){ return d.online; });
    if (!state.selectedKeys.length && online.length === 1) {
      state.selectedKeys = [online[0].key];
    }
    renderPeers();
  }

  function renderPeers(){
    var box = $('peerList');
    box.innerHTML = '';
    state.devices.forEach(function(d){
      var row = document.createElement('div');
      var fav = isFav(d);
      var cls = 'peer' + (d.online ? ' online' : ' offline') +
        (state.selectedKeys.indexOf(d.key) >= 0 ? ' sel' : '') + (fav ? ' fav' : '');
      row.className = cls;
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      var status = d.online
        ? '<span class="status-dot" title="在线"></span>'
        : '<span class="status-dot" title="未连接"></span><span class="status-text">未连接</span>';
      row.innerHTML =
        '<div class="avatar">' + esc((d.alias || '?').charAt(0).toUpperCase()) + '</div>' +
        '<div class="meta"><div class="alias">' + esc(d.alias) + status + '</div>' +
        '<div class="addr">' + esc(d.ip) + ':' + d.port + '</div></div>' +
        '<button class="star" type="button" title="' + (fav ? '取消收藏' : '收藏') + '">' +
        (fav ? '★' : '☆') + '</button>' +
        (d.manual ? '<button class="x" type="button" title="移除该设备">×</button>' : '');
      // 离线设备不可选中; 点击即切换选中, 一次可以勾上多台设备, 再点一次取消
      function pick(){
        if (!d.online) return;
        var i = state.selectedKeys.indexOf(d.key);
        if (i >= 0) state.selectedKeys.splice(i, 1);
        else state.selectedKeys.push(d.key);
        renderPeers();
      }
      row.addEventListener('click', pick);
      row.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
      });
      row.querySelector('.star').addEventListener('click', function(e){
        e.stopPropagation();
        toggleFav(d);
      });
      var x = row.querySelector('.x');
      if (x) x.addEventListener('click', function(e){
        e.stopPropagation();
        state.manual = state.manual.filter(function(m){ return !(m.ip === d.ip && m.port === d.port); });
        // 设备删了, 对应的收藏记录也一起清掉
        state.fav = state.fav.filter(function(f){ return f.addr !== devAddr(d); });
        saveManual();
        saveFav();
        state.peerKey = null;
        renderDevices();
      });
      box.appendChild(row);
    });
    if (!state.devices.length) {
      box.innerHTML = '<div class="empty-peer">暂无设备</div>';
    }
    $('peerCount').textContent = state.devices.length;
    renderTarget();
  }

  // 只在选中了设备时展示目标胶囊; 发送按钮的可用状态也在这里同步
  function renderTarget(){
    var sels = state.devices.filter(function(d){ return state.selectedKeys.indexOf(d.key) >= 0; });
    var chip = $('targetChip');
    if (sels.length && mode === 'send') {
      chip.hidden = false;
      chip.textContent = sels.length === 1
        ? '→ ' + sels[0].alias
        : '→ ' + sels[0].alias + ' 等 ' + sels.length + ' 台';
    } else {
      chip.hidden = true;
    }
    updateSendBtn();
  }

  /* ---------- 模式切换: 发送 / 接收 ---------- */
  var mode = 'send';
  function setMode(m){
    mode = m === 'recv' ? 'recv' : 'send';
    var send = mode === 'send';
    $('modeSend').classList.toggle('on', send);
    $('modeRecv').classList.toggle('on', !send);
    $('modeSend').setAttribute('aria-selected', send ? 'true' : 'false');
    $('modeRecv').setAttribute('aria-selected', send ? 'false' : 'true');
    $('drop').classList.toggle('recv-mode', !send);
    document.body.classList.toggle('recv-mode', !send);
    $('recvBody').hidden = send;
    $('sendQueue').hidden = !send;
    $('targetChip').hidden = true;
    if (send) {
      renderStaging();
      renderTarget();
    } else {
      $('dropEmpty').hidden = true;
      $('staging').hidden = true;
      loadRecvDir();
      loadReceived();
    }
  }
  $('modeSend').addEventListener('click', function(e){
    e.stopPropagation();
    setMode('send');
  });
  $('modeRecv').addEventListener('click', function(e){
    e.stopPropagation();
    setMode('recv');
  });

  function loadRecvDir(){
    fetch('/api/recvdir').then(function(r){ return r.json(); }).then(function(info){
      if (info.dir) setRecvDirShown(info.dir);
    }).catch(function(){});
  }

  // setRecvDirShown 同步输入框与服务端当前目录, 只有两者不一致时才露出“保存”
  function setRecvDirShown(dir){
    state.recvDir = dir || '';
    if (dir) {
      $('recvDirInput').value = dir;
      $('recvDir').textContent = '保存于 ' + dir;
      $('recvDir').title = dir;
    }
    syncSaveBtn();
  }
  function syncSaveBtn(){
    var v = $('recvDirInput').value.trim();
    $('recvDirSave').hidden = !state.recvDir || v === state.recvDir;
  }

  // 交给服务端弹系统目录选择框: 浏览器拿不到本机绝对路径, webkitdirectory 只给相对路径
  function pickRecvDir(){
    var btn = $('recvDirPick'), msg = $('recvMsg');
    msg.textContent = '';
    msg.className = 'recv-msg';
    btn.disabled = true;
    btn.textContent = '选择中…';
    fetch('/api/pickdir', { method: 'POST' }).then(function(r){
      return r.json().then(function(j){ return { ok: r.ok, body: j }; });
    }).then(function(res){
      btn.disabled = false;
      btn.textContent = '选择文件夹';
      if (!res.ok) {
        msg.textContent = res.body.error || '打开选择框失败, 也可以手动填写路径';
        msg.className = 'recv-msg err';
        return;
      }
      if (res.body.cancelled) {
        msg.textContent = '已取消选择';
        return;
      }
      setRecvDirShown(res.body.dir);
      msg.textContent = '已切换';
      msg.className = 'recv-msg ok';
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = '选择文件夹';
      msg.textContent = '请求失败, 检查本机服务是否还在运行';
      msg.className = 'recv-msg err';
    });
  }

  function saveRecvDir(){
    var btn = $('recvDirSave'), msg = $('recvMsg');
    var nd = $('recvDirInput').value.trim();
    msg.textContent = '';
    if (!nd) { msg.textContent = '请填写目录路径'; msg.className = 'recv-msg err'; return; }
    btn.disabled = true;
    fetch('/api/recvdir', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir: nd })
    }).then(function(r){
      return r.json().then(function(j){ return { ok: r.ok, dir: j.dir, err: j.error }; });
    }).then(function(res){
      btn.disabled = false;
      if (res.ok && res.dir) {
        setRecvDirShown(res.dir);
        msg.textContent = '已保存';
        msg.className = 'recv-msg ok';
      } else {
        msg.textContent = res.err || '保存失败';
        msg.className = 'recv-msg err';
      }
    }).catch(function(){
      btn.disabled = false;
      msg.textContent = '保存失败, 请重试';
      msg.className = 'recv-msg err';
    });
  }
  $('recvDirSave').onclick = saveRecvDir;
  $('recvDirPick').addEventListener('click', pickRecvDir);
  $('recvDirInput').addEventListener('input', syncSaveBtn);
  $('recvDirInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); saveRecvDir(); }
  });

  /* ---------- 最近接收 ---------- */
  function loadReceived(){
    fetch('/api/received').then(function(r){ return r.json(); }).then(function(list){
      state.received = Array.isArray(list) ? list : [];
      renderReceived();
    }).catch(function(){});
  }

  function fmtAge(ms){
    if (ms < 60 * 1000) return '刚刚';
    if (ms < 3600 * 1000) return Math.floor(ms / 60000) + ' 分钟前';
    if (ms < 86400 * 1000) return Math.floor(ms / 3600000) + ' 小时前';
    return Math.floor(ms / 86400000) + ' 天前';
  }

  function renderReceived(){
    var sec = $('recvSec'), box = $('recvList');
    sec.hidden = mode !== 'recv' || !state.received.length;
    box.innerHTML = '';
    state.received.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'item';
      row.style.cursor = 'default';
      row.innerHTML =
        '<div class="item-top"><span class="item-name"></span><span class="item-meta"></span></div>';
      row.querySelector('.item-name').textContent = it.name;
      row.querySelector('.item-meta').textContent =
        '来自 ' + it.from + ' · ' + fmtSize(it.size) + ' · ' + fmtAge(Date.now() - it.at_ms);
      row.title = '保存在 ' + it.dir;
      box.appendChild(row);
    });
  }

  /* ---------- 传输队列 ---------- */
  function renderQueue(){
    var box = $('queueList');
    box.innerHTML = '';
    state.jobs.forEach(function(job){
      var row = document.createElement('div');
      row.className = 'item';
      row.innerHTML =
        '<div class="item-top"><span class="item-name"></span><span class="item-meta"></span></div>' +
        '<div class="bar"><i></i></div>';
      row.querySelector('.item-name').textContent = job.name + ' → ' + job.toAlias;
      job.el = row;
      box.appendChild(row);
      paint(job);
    });
    $('queueEmpty').style.display = state.jobs.length ? 'none' : 'block';
  }

  function paint(job){
    if (!job.el) return;
    job.el.querySelector('.bar i').style.width = Math.round(Math.min(1, job.pct) * 100) + '%';
    job.el.querySelector('.item-meta').textContent = job.status;
    job.el.classList.toggle('done', job.done === true);
    job.el.classList.toggle('err', !!job.failed || (job.errors && job.errors.length > 0));
    // 失败原因随传输过程即时出现, 不用等整个任务跑完
    var note = job.el.querySelector('.item-note');
    var lines = (job.errors || []).slice(0, 4).map(function(e){
      return e.name + '：' + e.msg;
    });
    if (job.errors && job.errors.length > 4) {
      lines.push('… 还有 ' + (job.errors.length - 4) + ' 个失败');
    }
    if (lines.length) {
      if (!note) {
        note = document.createElement('div');
        note.className = 'item-note';
        job.el.appendChild(note);
      }
      note.textContent = lines.join('\n');
    } else if (note) {
      note.remove();
    }
  }

  // groups: [{name, root, files:[{file, rel}]}]
  function enqueueGroups(groups){
    var sels = state.devices.filter(function(d){ return state.selectedKeys.indexOf(d.key) >= 0; });
    if (!sels.length) { flashNeed(); return; }
    // 每个选中的设备各生成一个任务, 逐台串行发送, 哪台失败一目了然
    groups.forEach(function(g){
      sels.forEach(function(dev){
        state.jobs.push({
          id: Math.random().toString(36).slice(2),
          name: g.name, root: g.root, files: g.files,
          to: dev.target, toAlias: dev.alias,
          idx: 0, pct: 0, status: '排队中', done: false, failed: false, errors: []
        });
      });
    });
    renderQueue();
    pump();
  }

  function pump(){
    if (state.busy) return;
    var job = state.jobs.filter(function(j){ return j.status === '排队中'; })[0];
    if (!job) { state.busy = false; return; }
    state.busy = true;
    // catch 兜底: 任何一个任务调度异常都不能让队列卡死
    runJob(job).catch(function(){
      job.failed = true;
      job.status = '已中断';
      paint(job);
    }).then(function(){ state.busy = false; pump(); });
  }

  function runJob(job){
    job.idx = 0;
    job.errors = [];
    job.fatal = '';
    // 必须返回 Promise: pump 靠它串行调度后续任务, 之前没返回导致队列卡死
    return new Promise(function(resolve){
      (function step(){
        if (job.idx >= job.files.length) {
          job.pct = 1;
          job.failed = job.errors.length > 0;
          job.done = !job.failed;
          if (job.failed) {
            job.status = job.errors.length + ' 个失败';
            if (job.fatal) {
              // 设备掉线 / 端口不通: 后面的文件也发不出去, 不再逐个尝试
              job.status = '已中断';
              job.errors.push({ name: '剩余 ' + (job.files.length - job.idx) + ' 个文件', msg: '未发送' });
            }
          } else {
            job.status = job.files.length > 1 ? job.files.length + ' 个文件已完成' : '已完成';
          }
          paint(job);
          resolve();
          return;
        }
        if (job.fatal) {
          // 前面已经判定连接不可用, 剩余文件直接记为未发送
          job.idx = job.files.length;
          step();
          return;
        }
        var item = job.files[job.idx];
        job.status = job.files.length > 1 ? (job.idx + 1) + '/' + job.files.length : '准备中';
        paint(job);
        sendFile(job, item).then(function(){
          job.idx++;
          step();
        });
      })();
    });
  }

  // 从非 200 响应里取出服务端给的真实原因
  function serverError(xhr){
    try {
      var o = JSON.parse(xhr.responseText || '');
      if (o && o.error) return o.error;
    } catch (e) {}
    switch (xhr.status) {
      case 0: return '连不上目标设备';
      case 400: return '目标端拒绝了请求 (参数不合法)';
      case 404: return '目标设备不在线';
      case 500: return '目标端写入失败 (磁盘已满或没有权限)';
      case 503: return '本机设备发现未启用';
      default: return 'HTTP ' + xhr.status;
    }
  }

  function sendFile(job, item){
    return new Promise(function(resolve){
      var xhr = new XMLHttpRequest();
      var file = item.file;
      var label = item.rel || item.name || (file && file.name) || '';
      var q = '/api/send?to=' + encodeURIComponent(job.to) + '&name=' + encodeURIComponent(label);
      if (job.root) {
        q += '&root=' + encodeURIComponent(job.root) + '&rel=' + encodeURIComponent(item.rel);
      }
      // 原生模式: 后端按本机路径直读, 不传文件流
      if (item.localPath) {
        q += '&localPath=' + encodeURIComponent(item.localPath);
      }
      xhr.open('POST', q);
      if (!item.localPath) {
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      }
      xhr.timeout = 30 * 60 * 1000;

      var seen = 0;
      var reported = false;
      function setPct(p){
        job.pct = (job.idx + p) / job.files.length;
      }
      function fail(msg, fatal){
        if (reported) return;
        reported = true;
        job.errors.push({ name: label, msg: msg });
        if (fatal) job.fatal = msg;
        paint(job);
      }
      function handle(line){
        if (!line.trim()) return;
        var m;
        try { m = JSON.parse(line); } catch (e) { return; }
        if (m.phase === 'sending') {
          var p = m.total > 0 ? m.done / m.total : 0;
          setPct(p);
          var prefix = job.files.length > 1 ? (job.idx + 1) + '/' + job.files.length + '  ' : '';
          job.status = prefix + Math.round(p * 100) + '%';
        } else if (m.phase === 'done') {
          setPct(1);
        } else if (m.phase === 'error') {
          fail(m.error || '未知错误', false);
        }
        paint(job);
      }

      xhr.onprogress = function(){
        var text = xhr.responseText.slice(seen);
        seen += text.length;
        text.split('\n').forEach(handle);
      };
      xhr.onload = function(){
        if (xhr.status !== 200) {
          // 连不上 / 设备不在线 / 目标端写入失败: 后面的文件也没必要再试
          fail(serverError(xhr), xhr.status === 0 || xhr.status === 404 || xhr.status === 503);
        }
        resolve();
      };
      xhr.onerror = function(){
        fail('连接中断，已传数据保留，重试可续传', true);
        resolve();
      };
      xhr.ontimeout = function(){
        fail('上传超时，已传数据保留，重试可续传', false);
        resolve();
      };
      xhr.onabort = function(){
        fail('已取消', false);
        resolve();
      };
      xhr.send(item.localPath ? null : file);
    });
  }

  // 从拖放数据里还原文件与目录结构
  function collectGroups(dt){
    var items = dt.items ? Array.prototype.slice.call(dt.items) : [];
    var roots = [];
    items.forEach(function(it){
      if (it.kind !== 'file') return;
      var e = it.webkitGetAsEntry && it.webkitGetAsEntry();
      if (e) roots.push(e);
    });
    if (!roots.length) {
      var plain = Array.prototype.slice.call(dt.files || []).map(function(f){
        return { name: f.name, root: '', files: [{ file: f, rel: '' }] };
      });
      return Promise.resolve(plain);
    }
    return Promise.all(roots.map(function(e){ return readRoot(e); })).then(function(gs){
      return gs.filter(function(g){ return g !== null; });
    });
  }

  function readRoot(entry){
    if (entry.isFile) {
      return new Promise(function(res){
        entry.file(function(f){
          res({ name: f.name, root: '', files: [{ file: f, rel: '' }] });
        }, function(){ res(null); });
      });
    }
    if (!entry.isDirectory) return Promise.resolve(null);
    var out = [];
    return walkDir(entry, '', out).then(function(){
      if (!out.length) return null;
      return { name: entry.name, root: entry.name, files: out };
    });
  }

  function walkDir(dirEntry, prefix, out){
    var reader = dirEntry.createReader();
    return new Promise(function(resolve){
      var batchAll = [];
      (function read(){
        reader.readEntries(function(batch){
          if (!batch.length) {
            Promise.all(batchAll.map(function(e){
              if (e.isDirectory) return walkDir(e, prefix + e.name + '/', out);
              if (!e.isFile) return null;
              return new Promise(function(r){
                e.file(function(f){
                  out.push({ file: f, rel: prefix + e.name });
                  r();
                }, function(){ r(); });
              });
            })).then(resolve);
            return;
          }
          batchAll = batchAll.concat(Array.prototype.slice.call(batch));
          read();
        }, function(){ resolve(); });
      })();
    });
  }

  function flashNeed(){
    var d = $('drop');
    d.classList.add('need');
    setTimeout(function(){ d.classList.remove('need'); }, 600);
  }

  /* ---------- 待发送列表 ---------- */
  function fmtSize(n){
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
  }

  function groupSize(g){
    var s = 0;
    g.files.forEach(function(f){ s += (f.file && f.file.size) || f.size || 0; });
    return s;
  }

  function addPending(groups){
    groups.forEach(function(g){ state.pending.push(g); });
    renderStaging();
  }

  function renderStaging(){
    var staged = state.pending.length > 0;
    $('drop').classList.toggle('staged', staged);
    // 接收模式下卡片里展示的是接收目录设置, 待发送列表整体让位
    if (mode !== 'send') {
      $('dropEmpty').hidden = true;
      $('staging').hidden = true;
      updateSendBtn();
      return;
    }
    $('dropEmpty').hidden = staged;
    $('staging').hidden = !staged;
    if (!staged) { updateSendBtn(); return; }

    var total = 0;
    var box = $('stageList');
    box.innerHTML = '';
    state.pending.forEach(function(g, i){
      var size = groupSize(g);
      var folder = !!g.root;
      total += size;
      var row = document.createElement('div');
      row.className = 'stage-item';
      row.innerHTML =
        '<div class="ico">' + (folder ? 'DIR' : 'FILE') + '</div>' +
        '<div class="nm"><b>' + esc(folder ? g.name + '/' : g.name) + '</b>' +
        '<span>' + (folder ? g.files.length + ' 个文件 · ' : '') + fmtSize(size) + '</span></div>' +
        '<button class="x" type="button" title="移除">×</button>';
      row.querySelector('.x').addEventListener('click', function(e){
        e.stopPropagation();
        state.pending.splice(i, 1);
        renderStaging();
      });
      box.appendChild(row);
    });
    $('stageSum').textContent = state.pending.length + ' 项 · ' + fmtSize(total);
    updateSendBtn();
  }

  function updateSendBtn(){
    var btn = $('sendBtn'), hint = $('sendHint');
    var n = state.pending.length;
    var sels = state.devices.filter(function(d){ return state.selectedKeys.indexOf(d.key) >= 0 && d.online; });
    btn.textContent = n
      ? (sels.length > 1 ? '发送 ' + n + ' 项到 ' + sels.length + ' 台设备' : '发送 ' + n + ' 项')
      : '发送';
    btn.disabled = !(n && sels.length);
    if (!n) hint.textContent = '先拖入文件或文件夹';
    else if (!sels.length) hint.textContent = '先选择在线设备，点选可多选';
    else hint.textContent = sels.length === 1
      ? '发送到 ' + sels[0].alias
      : '发送到 ' + sels[0].alias + ' 等 ' + sels.length + ' 台设备，逐台传输';
  }

  /* ---------- 交互 ---------- */
  var drop = $('drop');
  var depth = 0;

  drop.addEventListener('dragenter', function(e){
    e.preventDefault();
    if (mode !== 'send') return;
    depth++;
    drop.classList.add('over');
  });
  drop.addEventListener('dragover', function(e){ e.preventDefault(); });
  drop.addEventListener('dragleave', function(e){
    e.preventDefault();
    depth = Math.max(0, depth - 1);
    if (depth === 0) drop.classList.remove('over');
  });
  drop.addEventListener('drop', function(e){
    e.preventDefault();
    depth = 0;
    drop.classList.remove('over');
    if (mode !== 'send') return;
    if (!e.dataTransfer) return;
    collectGroups(e.dataTransfer).then(function(groups){
      if (groups.length) addPending(groups);
    });
  });
  drop.addEventListener('click', function(){
    if (mode !== 'send') return;
    if (state.pending.length) return; // 已有待发送文件时, 点空白处不弹选择框
    pickFiles();
  });
  drop.addEventListener('keydown', function(e){
    if ((e.key === 'Enter' || e.key === ' ') && !state.pending.length) {
      e.preventDefault();
      if (mode === 'send') pickFiles();
    }
  });
  $('dirPick').addEventListener('click', function(e){
    e.stopPropagation();
    pickDirs();
  });
  $('filePick').addEventListener('click', function(e){
    e.stopPropagation();
    pickFiles();
  });
  $('stageAdd').addEventListener('click', function(e){
    e.stopPropagation();
    pickFiles();
  });
  $('stageClear').addEventListener('click', function(e){
    e.stopPropagation();
    state.pending = [];
    renderStaging();
  });
  $('sendBtn').addEventListener('click', function(){
    if (!state.pending.length) return;
    var groups = state.pending.slice();
    state.pending = [];
    renderStaging();
    enqueueGroups(groups);
  });
  $('fileInput').addEventListener('change', function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    if (files.length) {
      addPending(files.map(function(f){
        return { name: f.name, root: '', files: [{ file: f, rel: '' }] };
      }));
    }
    e.target.value = '';
  });
  $('dirInput').addEventListener('change', function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    // webkitRelativePath 形如 "tree/src/a.txt", 第一段是根目录名
    var parts = (files[0].webkitRelativePath || '').split('/');
    var root = parts[0] || 'folder';
    var items = files.map(function(f){
      var seg = (f.webkitRelativePath || '').split('/');
      var rel = seg.slice(1).join('/');
      return { file: f, rel: rel || f.name };
    });
    addPending([{ name: root, root: root, files: items }]);
  });
  $('clearBtn').addEventListener('click', function(){
    state.jobs = state.jobs.filter(function(j){ return !j.done && !j.failed; });
    renderQueue();
  });

  // 防止把文件拖到页面其它地方时浏览器直接打开它
  ['dragover','drop'].forEach(function(ev){
    window.addEventListener(ev, function(e){ e.preventDefault(); });
  });

  /* ---------- 手动添加设备 ---------- */
  function addErr(msg){
    var el = $('addErr');
    if (!msg) { el.hidden = true; el.textContent = ''; return; }
    el.textContent = msg;
    el.hidden = false;
  }
  $('addBtn').addEventListener('click', function(){
    var form = $('addForm');
    form.hidden = !form.hidden;
    addErr('');
    if (!form.hidden) $('addInput').focus();
  });
  $('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var raw = $('addInput').value.trim();
    if (!raw) return;
    addErr('');
    fetch('/api/probe?addr=' + encodeURIComponent(raw))
      .then(function(r){
        return r.json().then(function(j){ return { ok: r.ok, body: j }; });
      })
      .then(function(res){
        if (!res.ok) { addErr(res.body.error || '添加失败'); return; }
        var addr = res.body.addr;
        var i = addr.lastIndexOf(':');
        var ip = addr.slice(0, i), port = parseInt(addr.slice(i + 1), 10);
        state.manual = state.manual.filter(function(m){ return !(m.ip === ip && m.port === port); });
        state.manual.push({ ip: ip, port: port, alias: res.body.alias });
        state.online[ip + ':' + port] = true;
        saveManual();
        state.selectedKeys = ['addr:' + ip + ':' + port];
        state.peerKey = null;
        $('addInput').value = '';
        $('addForm').hidden = true;
        renderDevices();
        renderPeers();
      })
      .catch(function(){ addErr('请求失败，检查本机服务是否还在运行'); });
  });

  loadManual();
  loadFav();
  loadInfo();
  renderStaging();
  loadDevices();
  loadReceived();
  setInterval(loadDevices, 2000);
  setInterval(loadReceived, 2000);
  // 周期性探活: 在线状态由真实 TCP 连通性决定, 组播只是用来发现设备
  setInterval(pingAll, 5000);
  setTimeout(pingAll, 600);
  // 心跳保活: 后端托管模式靠它判断页面还开着; 页面关闭/崩溃后心跳停止, 服务随之退出。
  // 周期用普通 fetch; 页面隐藏或即将关闭时改用 sendBeacon 兜底, 尽量把最后一次心跳发出去。
  function sendHeartbeat(){
    try {
      if (navigator.sendBeacon) { navigator.sendBeacon('/api/heartbeat', new Blob([])); return; }
    } catch(e){}
    fetch('/api/heartbeat', { method: 'POST', keepalive: true }).catch(function(){});
  }
  setInterval(sendHeartbeat, 3000);
  sendHeartbeat();
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') sendHeartbeat();
  });
  window.addEventListener('beforeunload', sendHeartbeat);
})();
</script>
</body>
</html>
